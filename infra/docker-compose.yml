version: "3.9"

services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ..:/app
    command: >
      sh -c "pip install fastapi uvicorn pydantic &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DEFAULT_MODEL: gpt-4.1-mini

  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ..:/app
    command: >
      sh -c "pip install pydantic &&
             python apps/worker/worker.py"
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DEFAULT_MODEL: gpt-4.1-mini